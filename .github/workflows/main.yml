
name: Main

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Setup Test Dependencies
      run: pip3 install --no-cache-dir -r ${GITHUB_WORKSPACE}/tests/requirements.txt
    - name: Cache
      uses: actions/cache@v5.0.4
      with:
          key: x86
          path: |
            src/Infrastructure/src/Emulator/Cores/bin/*
            src/Infrastructure/src/Emulator/Cores/obj/*
    - name: Build
      run: export CC=gcc; ./build.sh -n -t -B linux-x64
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: output/packages/*
        if-no-files-found: error
        archive: false

  build_aarch64:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-11-aarch64-linux-gnu
    - uses: actions/checkout@v6.0.2
    - name: Setup Test Dependencies
      run: pip3 install --no-cache-dir -r ${GITHUB_WORKSPACE}/tests/requirements.txt
    - name: Cache
      uses: actions/cache@v5.0.4
      with:
          key: aarch64
          path: |
            src/Infrastructure/src/Emulator/Cores/bin/*
            src/Infrastructure/src/Emulator/Cores/obj/*
    - name: Build
      run: export CC=aarch64-linux-gnu-gcc-11; ./build.sh -n --host-arch aarch64 -t -B linux-arm64
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: output/packages/*
        if-no-files-found: error
        archive: false

      
