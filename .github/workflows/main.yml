
name: Main

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo add-apt-repository ppa:dotnet/backports -y
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            apt-transport-https \
            dirmngr \
            gnupg \
            ca-certificates \
            software-properties-common \
            dotnet-sdk-9.0 \
            dotnet-runtime-9.0 \
            automake \
            cmake \
            autoconf \
            libtool \
            g++ \
            coreutils \
            policykit-1 \
            libgtk-3-dev \
            uml-utilities \
            gtk-sharp3 \
            python3 \
            python3-pip \
            gcc-11-aarch64-linux-gnu

  build_x86_64:
    runs-on: ubuntu-latest
    needs: dependencies 
    steps:
    - uses: actions/checkout@v6.0.2       
    - name: Setup Test Dependencies
      run: pip3 install --no-cache-dir -r ${GITHUB_WORKSPACE}/tests/requirements.txt
    - name: Build
      run: export CC=gcc; ./build.sh -n -t -B linux-x64
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: output/packages/*
        if-no-files-found: error
        archive: false

  build_aarch64:
    runs-on: ubuntu-latest
    needs: dependencies 
    steps:
    - uses: actions/checkout@v6.0.2       
    - name: Setup Test Dependencies
      run: pip3 install --no-cache-dir -r ${GITHUB_WORKSPACE}/tests/requirements.txt
    - name: Build
      run: export CC=aarch64-linux-gnu-gcc-11; ./build.sh -n --host-arch aarch64 -t -B linux-arm64
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: output/packages/*
        if-no-files-found: error
        archive: false

      
